<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modest Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6bfb'/%3E%3Crect x='16' y='12' width='32' height='40' rx='6' fill='white' opacity='.95'/%3E%3Crect x='20' y='18' width='24' height='10' rx='3' fill='%234f6bfb'/%3E%3Ccircle cx='24' cy='36' r='3' fill='%234f6bfb'/%3E%3Ccircle cx='32' cy='36' r='3' fill='%234f6bfb'/%3E%3Ccircle cx='40' cy='36' r='3' fill='%234f6bfb'/%3E%3Ccircle cx='24' cy='44' r='3' fill='%234f6bfb'/%3E%3Ccircle cx='32' cy='44' r='3' fill='%234f6bfb'/%3E%3Ccircle cx='40' cy='44' r='3' fill='%234f6bfb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- decorative floating background shapes -->
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="shape shape-dot"></span>
    <span class="shape shape-plus">+</span>
    <span class="shape shape-percent">%</span>
    <span class="shape shape-eq">=</span>
  </div>

  <div class="app" id="app">

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="2.5" width="16" height="19" rx="3"/>
            <path d="M7.5 6.5h9" stroke-width="2"/>
            <circle cx="8" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="16" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="8" cy="16" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="16" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="16" cy="16" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-name">Modest Calculator</span>
      </div>

      <nav class="mode-switch" role="tablist" aria-label="Calculator mode">
        <button class="mode-btn is-active" data-mode="calc" role="tab" aria-selected="true">Calculator</button>
        <button class="mode-btn" data-mode="template" role="tab" aria-selected="false">% Change</button>
        <span class="mode-thumb" aria-hidden="true"></span>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Toggle dark mode (Ctrl+D)">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/>
          </svg>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===================== STANDARD CALCULATOR ===================== -->
    <section class="panel calc-panel is-active" id="calcPanel" aria-hidden="false">
      <div class="calc-body">
        <div class="calc-core">
          <div class="display">
            <div class="display-expr" id="calcExpr">&nbsp;</div>
            <div class="display-value" id="calcValue" title="Ctrl+C to copy">0</div>
          </div>

          <div class="keys">
            <button class="key key-fn" data-action="ce" title="Backspace clears entry, Esc clears all">CE</button>
            <button class="key key-fn" data-action="clear" title="Esc / Ctrl+L">C</button>
            <button class="key key-fn" data-action="backspace" title="Backspace">⌫</button>
            <button class="key key-fn" data-action="percent" title="%">%</button>

            <button class="key key-num" data-num="7" title="Key: 7">7</button>
            <button class="key key-num" data-num="8" title="Key: 8">8</button>
            <button class="key key-num" data-num="9" title="Key: 9">9</button>
            <button class="key key-op key-op--div" data-action="op" data-op="÷" title="Key: /">÷</button>

            <button class="key key-num" data-num="4" title="Key: 4">4</button>
            <button class="key key-num" data-num="5" title="Key: 5">5</button>
            <button class="key key-num" data-num="6" title="Key: 6">6</button>
            <button class="key key-op key-op--mul" data-action="op" data-op="×" title="Key: *">×</button>

            <button class="key key-num" data-num="1" title="Key: 1">1</button>
            <button class="key key-num" data-num="2" title="Key: 2">2</button>
            <button class="key key-num" data-num="3" title="Key: 3">3</button>
            <button class="key key-op key-op--sub" data-action="op" data-op="−" title="Key: -">−</button>

            <button class="key key-fn" data-action="negate" title="+/-">+/-</button>
            <button class="key key-num" data-num="0" title="Key: 0">0</button>
            <button class="key key-num" data-action="decimal" title="Key: .">.</button>
            <button class="key key-op key-op--add" data-action="op" data-op="+" title="Key: +">+</button>

            <button class="key key-eq" data-action="equals" title="Enter">=</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== % CHANGE TEMPLATE ===================== -->
    <section class="panel template-panel" id="templatePanel" aria-hidden="true">

      <div class="field-grid">
        <div class="field field--original">
          <label class="field-label" for="originalInput">Enter original value</label>
          <input class="field-input" id="originalInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>

        <div class="field field--final">
          <label class="field-label" for="finalInput">Enter final value</label>
          <input class="field-input" id="finalInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>

        <div class="field field--base">
          <label class="field-label" for="baseInput">Base <span class="field-sub">(resets to 100)</span></label>
          <input class="field-input" id="baseInput" type="text" inputmode="decimal" autocomplete="off" value="100">
          <div class="field-hint" id="baseHint"></div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">Difference <span class="stat-formula">original − final</span></div>
          <div class="result-row">
            <div class="stat-value" id="diffValue" title="Ctrl+Shift+C to copy">0</div>
            <button class="copy-btn copy-btn--sm" id="diffCopyBtn" type="button" title="Copy difference">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="8.5" y="8.5" width="11" height="11" rx="2"/>
                <path d="M4.5 15.5V6.2A1.7 1.7 0 0 1 6.2 4.5h9.3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="stat-card stat-card--result">
          <div class="stat-label-row">
            <div class="stat-label" id="resultLabel">% Change <span class="stat-formula" id="resultFormula">((original − final) / original) × base</span></div>
            <span class="status-badge" id="statusBadge" hidden></span>
          </div>
          <div class="result-row">
            <div class="stat-value stat-value--big" id="resultValue" title="Ctrl+C to copy">0</div>
            <button class="copy-btn" id="copyBtn" type="button" title="Ctrl+C">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="8.5" y="8.5" width="11" height="11" rx="2"/>
                <path d="M4.5 15.5V6.2A1.7 1.7 0 0 1 6.2 4.5h9.3"/>
              </svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      </div>

      <p class="reset-hint">Enter moves to the next field · Esc clears · Base resets to 100 on refresh</p>

    </section>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" aria-live="polite" aria-atomic="true">Copied to clipboard</div>

<script src="script.js"></script>
</body>
</html>
