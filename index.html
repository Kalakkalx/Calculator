<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modest Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Background Elements -->
  <div class="bg-shape shape-1">%</div>
  <div class="bg-shape shape-2">÷</div>
  <div class="bg-shape shape-3">+</div>
  <div class="bg-shape shape-4">−</div>
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    Copied to clipboard
  </div>

  <div class="app" id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 9h4M7 13h4M7 17h10M13 9h4" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="app-title">Modest Calculator</span>
      </div>

      <nav class="mode-switch" id="modeSwitch" role="tablist">
        <button class="mode-btn is-active" data-mode="calc" role="tab">Calculator</button>
        <button class="mode-btn" data-mode="template" role="tab">% Change</button>
        <span class="mode-thumb"></span>
      </nav>

      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="window-controls">
          <button class="win-btn win-min" aria-label="Minimize"></button>
          <button class="win-btn win-max" aria-label="Maximize"></button>
          <button class="win-btn win-close" aria-label="Close"></button>
        </div>
      </div>
    </header>

    <div class="dashboard">
      <!-- ===================== STANDARD CALCULATOR ===================== -->
      <section class="panel calc-panel is-active" id="calcPanel">
        <div class="calc-body">
          <div class="display">
            <button class="history-toggle-btn" id="historyToggleBtn" aria-label="Toggle History">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </button>
            <div class="display-expr" id="calcExpr">&nbsp;</div>
            <div class="display-value" id="calcValue">0</div>
          </div>

          <div class="keys">
            <button class="key key-fn fn-purple" data-action="clear-entry">CE</button>
            <button class="key key-fn fn-purple" data-action="clear">C</button>
            <button class="key key-fn fn-purple" data-action="backspace">⌫</button>
            <button class="key key-op" data-action="op" data-op="÷">÷</button>

            <button class="key key-num" data-num="7">7</button>
            <button class="key key-num" data-num="8">8</button>
            <button class="key key-num" data-num="9">9</button>
            <button class="key key-op" data-action="op" data-op="×">×</button>

            <button class="key key-num" data-num="4">4</button>
            <button class="key key-num" data-num="5">5</button>
            <button class="key key-num" data-num="6">6</button>
            <button class="key key-op" data-action="op" data-op="−">−</button>

            <button class="key key-num" data-num="1">1</button>
            <button class="key key-num" data-num="2">2</button>
            <button class="key key-num" data-num="3">3</button>
            <button class="key key-op" data-action="op" data-op="+">+</button>

            <button class="key key-fn fn-purple" data-action="negate">+/-</button>
            <button class="key key-num" data-num="0">0</button>
            <button class="key key-num" data-action="decimal">.</button>
            <button class="key key-eq" data-action="equals">=</button>
          </div>
        </div>

        <aside class="history-panel" id="historyPanel">
          <div class="history-head">
            <input type="text" id="historySearch" placeholder="Search history..." class="history-search" autocomplete="off">
            <button class="text-btn" id="historyClear">Clear All</button>
            <button class="close-history-btn" id="closeHistoryBtn" aria-label="Close History">✕</button>
          </div>
          <ul class="history-list" id="historyList">
            <li class="history-empty" id="historyEmpty">No calculations yet</li>
          </ul>
        </aside>
      </section>

      <!-- ===================== % CHANGE TEMPLATE ===================== -->
      <section class="panel template-panel" id="templatePanel">
        <div class="template-header">
          <h2>Percentage Change Calculator</h2>
          <button class="info-btn" aria-label="Information">i</button>
        </div>

        <div class="field-grid">
          <div class="field field-blue">
            <div class="input-wrapper">
              <input class="field-input" id="originalInput" type="text" tabindex="1" autocomplete="off" placeholder=" ">
              <label class="field-label" for="originalInput">ENTER ORIGINAL VALUE</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>

          <div class="field field-green">
            <div class="input-wrapper">
              <input class="field-input" id="finalInput" type="text" tabindex="2" autocomplete="off" placeholder=" ">
              <label class="field-label" for="finalInput">ENTER FINAL VALUE</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>

          <div class="field field-purple">
            <div class="input-wrapper">
              <input class="field-input" id="baseInput" type="text" tabindex="3" autocomplete="off" placeholder=" ">
              <label class="field-label" for="baseInput">BASE (DEFAULT 100)</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>
        </div>

        <div class="result-card">
          <div class="result-col">
            <div class="stat-label">DIFFERENCE <button class="copy-icon-btn ripple-btn" id="copyDiffBtn" tabindex="4">⎘</button></div>
            <div class="stat-value" id="diffValue">0</div>
          </div>
          
          <div class="result-col">
            <div class="stat-label">PERCENTAGE CHANGE <span class="badge" id="statusBadge"></span></div>
            <div class="stat-value" id="resultValue">0</div>
          </div>

          <button class="copy-btn ripple-btn" id="copyBtn" tabindex="5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></svg>
            <span id="copyLabel">Copy</span>
          </button>
        </div>

        <p class="reset-hint">↻ Base value resets to 100 on refresh</p>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
