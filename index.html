<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modest Calculator Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Optimized Cursor Glow -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Ambient Background Typography & Shapes with Animation -->
  <div class="bg-symbol symbol-1">%</div>
  <div class="bg-symbol symbol-2">+</div>
  <div class="bg-symbol symbol-3">÷</div>
  <div class="bg-symbol symbol-4">8</div>
  <div class="bg-symbol symbol-5">0</div>
  
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <!-- Toast Notification (Bottom Right for Desktop) -->
  <div id="toast" class="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toastText">Copied to clipboard</span>
  </div>

  <div class="app fade-in" id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3"/>
            <line x1="8" y1="6" x2="16" y2="6"/>
            <line x1="8" y1="10" x2="10" y2="10"/>
            <line x1="14" y1="10" x2="16" y2="10"/>
            <line x1="8" y1="14" x2="10" y2="14"/>
            <line x1="14" y1="14" x2="16" y2="14"/>
            <line x1="8" y1="18" x2="12" y2="18"/>
          </svg>
        </div>
        <span class="app-title">Modest Calculator <span class="pro-badge">PRO</span></span>
      </div>

      <nav class="mode-switch" id="modeSwitch" role="tablist">
        <button class="mode-btn is-active" data-mode="calc" role="tab">Calculator</button>
        <button class="mode-btn" data-mode="template" role="tab">% Change</button>
        <span class="mode-thumb"></span>
      </nav>

      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode (Ctrl+T)" title="Toggle Dark Mode (Ctrl+T)">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="window-controls">
          <button class="win-btn win-min" aria-label="Minimize" title="Minimize"></button>
          <button class="win-btn win-max" aria-label="Maximize" title="Fullscreen (F11)"></button>
          <button class="win-btn win-close" aria-label="Close" title="Close"></button>
        </div>
      </div>
    </header>

    <div class="dashboard">
      <!-- ===================== STANDARD CALCULATOR ===================== -->
      <section class="panel calc-panel is-active" id="calcPanel">
        <div class="calc-body">
          <div class="display">
            <button class="history-toggle-btn glass-btn" id="historyToggleBtn" aria-label="Toggle History (Ctrl+H)" title="Toggle History (Ctrl+H)">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </button>
            <div class="display-expr-container" id="exprContainer">
              <div class="display-expr" id="calcExpr">&nbsp;</div>
            </div>
            <div class="display-value" id="calcValue">0</div>
          </div>

          <div class="keys">
            <!-- Row 1 -->
            <button class="key key-fn fn-purple ripple-btn" data-action="clear-entry" tabindex="0">CE</button>
            <button class="key key-fn fn-purple ripple-btn" data-action="clear" tabindex="0">C</button>
            <button class="key key-fn fn-purple ripple-btn" data-action="backspace" tabindex="0">⌫</button>
            <button class="key key-op ripple-btn" data-action="percent" tabindex="0">%</button>

            <!-- Row 2 -->
            <button class="key key-num ripple-btn" data-num="7" tabindex="0">7</button>
            <button class="key key-num ripple-btn" data-num="8" tabindex="0">8</button>
            <button class="key key-num ripple-btn" data-num="9" tabindex="0">9</button>
            <button class="key key-op ripple-btn" data-action="op" data-op="÷" tabindex="0">÷</button>

            <!-- Row 3 -->
            <button class="key key-num ripple-btn" data-num="4" tabindex="0">4</button>
            <button class="key key-num ripple-btn" data-num="5" tabindex="0">5</button>
            <button class="key key-num ripple-btn" data-num="6" tabindex="0">6</button>
            <button class="key key-op ripple-btn" data-action="op" data-op="×" tabindex="0">×</button>

            <!-- Row 4 -->
            <button class="key key-num ripple-btn" data-num="1" tabindex="0">1</button>
            <button class="key key-num ripple-btn" data-num="2" tabindex="0">2</button>
            <button class="key key-num ripple-btn" data-num="3" tabindex="0">3</button>
            <button class="key key-op ripple-btn" data-action="op" data-op="−" tabindex="0">−</button>

            <!-- Row 5 -->
            <button class="key key-fn fn-purple ripple-btn" data-action="negate" tabindex="0">+/-</button>
            <button class="key key-num ripple-btn" data-num="0" tabindex="0">0</button>
            <button class="key key-num ripple-btn" data-action="decimal" tabindex="0">.</button>
            <button class="key key-op ripple-btn" data-action="op" data-op="+" tabindex="0">+</button>
            
            <!-- Row 6 -->
            <button class="key key-eq ripple-btn" data-action="equals" tabindex="0">
              <span class="eq-lines">══════════════</span>
              <span class="eq-symbol">=</span>
              <span class="eq-lines">══════════════</span>
            </button>
          </div>
        </div>

        <aside class="history-panel" id="historyPanel">
          <div class="history-head">
            <input type="text" id="historySearch" placeholder="Search history & timestamps..." class="history-search" autocomplete="off">
            <div class="history-actions-group">
              <button class="text-btn" id="historyExportCsv" title="Export as CSV">CSV</button>
              <button class="text-btn" id="historyExportTxt" title="Export as TXT">TXT</button>
              <button class="text-btn text-danger" id="historyClear">Clear All</button>
            </div>
            <button class="close-history-btn" id="closeHistoryBtn" aria-label="Close History">✕</button>
          </div>
          <ul class="history-list" id="historyList">
            <li class="history-empty" id="historyEmpty">No calculations yet</li>
          </ul>
        </aside>
      </section>

      <!-- ===================== % CHANGE TEMPLATE ===================== -->
      <section class="panel template-panel" id="templatePanel">
        <div class="template-header">
          <h2>Percentage Change Calculator</h2>
          <div class="template-tip">Tip: Press Enter to move between inputs</div>
        </div>

        <div class="field-grid">
          <div class="field field-blue">
            <div class="input-wrapper">
              <input class="field-input" id="originalInput" type="text" tabindex="1" autocomplete="off" placeholder=" ">
              <label class="field-label" for="originalInput">ENTER ORIGINAL VALUE</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>

          <div class="field field-green">
            <div class="input-wrapper">
              <input class="field-input" id="finalInput" type="text" tabindex="2" autocomplete="off" placeholder=" ">
              <label class="field-label" for="finalInput">ENTER FINAL VALUE</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>

          <div class="field field-purple">
            <div class="input-wrapper">
              <input class="field-input" id="baseInput" type="text" tabindex="3" autocomplete="off" placeholder=" ">
              <label class="field-label" for="baseInput">BASE (DEFAULT 100)</label>
              <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18v-2H5V3H3zm6 14h2v-6H9v6zm4 0h2V9h-2v8zm4 0h2V5h-2v12z"/></svg>
            </div>
          </div>
        </div>

        <div class="result-card">
          <div class="result-col">
            <div class="stat-label">DIFFERENCE <button class="copy-icon-btn ripple-btn" id="copyDiffBtn" tabindex="4" title="Copy Difference">⎘</button></div>
            <div class="stat-value" id="diffValue">—</div>
          </div>
          
          <div class="result-col">
            <div class="stat-label">PERCENTAGE CHANGE <span class="badge" id="statusBadge"></span></div>
            <div class="stat-value" id="resultValue">—</div>
          </div>

          <button class="copy-btn ripple-btn" id="copyBtn" tabindex="5" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></svg>
            <span id="copyLabel">Copy Result</span>
          </button>
        </div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
